name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and security rules
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  tests-windows:
    name: Tests (Windows, Python 3.12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  browser-tests:
    # The dashboard and the request filter are tested in a real Chromium. In the other jobs
    # those tests are skipped when no browser is installed; here a missing browser is a failure.
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    env:
      JOBSCRAPER_REQUIRE_BROWSER: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the browser tests
        run: python -m pytest -q -rs tests/test_dashboard_browser.py tests/test_dashboard_filters_browser.py tests/test_redirect_filter_browser.py tests/test_browser_requirement.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the pinned dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
