name: Feature request
description: Suggest a new source, filter or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem you want solved before the solution.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links to a portal you would like to see added, examples, screenshots.
